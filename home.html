<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Registration page </title> 
    <style> 
        body{
            background-color: antiquewhite;
        }
       form {
    background-color: white;
    width: 500px;
    margin: 30px auto;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
}
h3{
    
    background-color: white;
    width: 500px;
    margin: 30px auto;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);

}
    </style>
</head> 
<body> 
     <h3>Enter details for Registration.</h3> 
   <form action ="/registration" method="post" enctype="multipart/form-data"> 
     <label>Name: </label> 
     <input type ="text" name ="name" required><br><br> 
     <label>Class:</label> 
     <input type ="text" name="class" required><br><br> 
     <label>Section:</label> 
     <input type  ="text" name="section" required><br><br> 
     <label>Gender:</label> 
     <input type = "radio" name="Gender" value = Male>Male 
     <input type = "radio" name ="Gender" value = Female>Female<br><br> 
     <label>Email:</label> 
     <input type ="email" name="email" required><br><br> 
     <label>Phone number:</label> 
     <input type ="number" name ="number" required><br><br> 
     <label>Enter documents:</label> 
     <input type ="file" name ="file" required><br><br> 
     <label>Student Photo:</label> 
     <input type="file" name="photo" accept="image/*" required><br><br> 
     <label>The information i shared checked twice:</label> 
     <input type ="radio" name = "submit" value = yes> yes 
     <input type ="radio" name ="submit" value =no> no <br><br> 
 
    <button type="submit" >Submit</button> 
   </form> 
    
     
</body> 
</html>
